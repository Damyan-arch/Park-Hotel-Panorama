<app-page-hero [title]="lang.t().rooms.heroTitle" [subtitle]="lang.t().rooms.heroSubtitle" />

<div class="container rooms-grid">
  @for (room of rooms(); track room.name) {
    <article class="room-card">
      <div class="room-photo">
        <img [src]="room.image" [alt]="room.name" loading="lazy" (error)="onImageError($event)" />
        <span class="photo-fallback-text">{{ lang.t().rooms.photoComingSoon }}</span>
      </div>
      <div class="room-body">
        <h3>{{ room.name }}</h3>
        <p class="room-meta">
          {{ room.sizeSqm }} m&sup2; &middot; {{ lang.t().rooms.maxLabel }} {{ room.maxGuests }}
        </p>
        <ul class="amenities">
          @for (amenity of room.amenities; track amenity) {
            <li>{{ amenity }}</li>
          }
        </ul>
        <a
          class="btn btn-accent"
          [routerLink]="routes.booking"
          [queryParams]="{ room: room.key }"
          >{{ lang.t().rooms.bookNow }}</a
        >
      </div>
    </article>
  }
</div>
