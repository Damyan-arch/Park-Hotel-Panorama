<app-page-hero [title]="lang.t().gallery.heroTitle" [subtitle]="lang.t().gallery.heroSubtitle" />

<div class="container gallery-grid">
  @for (photo of photos(); track photo.src; let i = $index) {
    <button type="button" class="gallery-item" (click)="open(i)">
      <img [src]="photo.src" [alt]="photo.alt" loading="lazy" />
    </button>
  }
</div>

@if (activePhoto(); as photo) {
  <div class="lightbox" (click)="close()">
    <button
      type="button"
      class="lightbox-close"
      (click)="close()"
      [attr.aria-label]="lang.t().gallery.close"
    >
      &times;
    </button>
    <img [src]="photo.src" [alt]="photo.alt" (click)="$event.stopPropagation()" />
  </div>
}
