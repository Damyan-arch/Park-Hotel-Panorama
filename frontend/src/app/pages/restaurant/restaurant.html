<app-page-hero [title]="lang.t().restaurant.heroTitle" [subtitle]="lang.t().restaurant.heroSubtitle" />

<section class="split-row">
  <div class="split-image">
    <img src="/images/restaurant/dining-hall.webp" [alt]="lang.t().restaurant.diningHallAlt" />
  </div>
  <div class="split-text">
    <h2>{{ lang.t().restaurant.workingHoursHeading }}</h2>
    <p>{{ lang.t().restaurant.hoursDays }}</p>
    <p>{{ lang.t().restaurant.hoursTime }}</p>
  </div>
</section>

<section class="split-row">
  <div class="split-text">
    <h2>{{ lang.t().restaurant.menuHeading }}</h2>
    <p>{{ lang.t().restaurant.menuComingSoon }}</p>
  </div>
  <div class="split-image">
    <img src="/images/restaurant/signature-dish.webp" [alt]="lang.t().restaurant.signatureDishAlt" />
  </div>
</section>
