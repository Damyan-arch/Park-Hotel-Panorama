<div class="date-range-picker">
  <div class="range-labels">
    <div class="range-label">
      <span>Check-in</span>
      <strong>{{ checkIn() || 'Select a date' }}</strong>
    </div>
    <div class="range-label">
      <span>Check-out</span>
      <strong>{{ checkOut() || 'Select a date' }}</strong>
    </div>
  </div>

  <div class="date-picker-panel">
    <div class="date-picker-header">
      <button type="button" class="nav-btn" (click)="prevMonth()" aria-label="Previous month">
        &lsaquo;
      </button>
      <span class="month-label">{{ monthLabel() }}</span>
      <button type="button" class="nav-btn" (click)="nextMonth()" aria-label="Next month">
        &rsaquo;
      </button>
    </div>

    <div class="weekday-row">
      @for (name of weekdayNames; track name) {
        <span class="weekday">{{ name }}</span>
      }
    </div>

    @for (week of weeks(); track $index) {
      <div class="week-row">
        @for (day of week; track day.iso) {
          <button
            type="button"
            class="day-cell"
            [class.is-outside]="!day.inCurrentMonth"
            [class.is-past]="day.isPast"
            [class.is-today]="day.isToday"
            [class.is-range-start]="day.isRangeStart"
            [class.is-range-end]="day.isRangeEnd"
            [class.is-range-middle]="day.isRangeMiddle"
            [class.is-single-selection]="day.isSingleSelection"
            [disabled]="day.isPast"
            (click)="selectDay(day)"
          >
            {{ day.day }}
          </button>
        }
      </div>
    }

    <div class="legend">
      <span class="legend-item"><span class="swatch swatch-available"></span>Available</span>
      <span class="legend-item"><span class="swatch swatch-past"></span>Unavailable</span>
      <span class="legend-item"><span class="swatch swatch-range"></span>In range</span>
      <span class="legend-item"><span class="swatch swatch-selected"></span>Selected</span>
    </div>
  </div>
</div>
