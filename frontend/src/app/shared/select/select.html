<div class="custom-select" [class.is-open]="isOpen()">
  <button type="button" class="select-trigger" (click)="toggle()">
    <span [class.is-placeholder]="!value()">{{ value() || placeholder() }}</span>
    <span class="chevron">&rsaquo;</span>
  </button>

  @if (isOpen()) {
    <ul class="select-options" role="listbox">
      @for (option of options(); track option) {
        <li
          role="option"
          class="select-option"
          [class.is-selected]="option === value()"
          (click)="selectOption(option)"
        >
          {{ option }}
        </li>
      }
    </ul>
  }
</div>
