<header class="site-header">
  <div class="bar container">
    <a class="brand" [routerLink]="routes.home" (click)="closeMenu()">
      <img class="brand-mark" src="images/brand/logo-mark.png" alt="" />
      Park Hotel Panorama
    </a>

    <button
      class="menu-toggle"
      type="button"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-label]="lang.t().nav.toggleNav"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav [class.is-open]="menuOpen()">
      <a [routerLink]="routes.rooms" routerLinkActive="active" (click)="closeMenu()">{{
        lang.t().nav.rooms
      }}</a>
      <a [routerLink]="routes.restaurant" routerLinkActive="active" (click)="closeMenu()">{{
        lang.t().nav.restaurant
      }}</a>
      <a [routerLink]="routes.gallery" routerLinkActive="active" (click)="closeMenu()">{{
        lang.t().nav.gallery
      }}</a>
      <a [routerLink]="routes.services" routerLinkActive="active" (click)="closeMenu()">{{
        lang.t().nav.services
      }}</a>
      <a [routerLink]="routes.location" routerLinkActive="active" (click)="closeMenu()">{{
        lang.t().nav.location
      }}</a>
      <a
        class="book-now btn btn-accent"
        [routerLink]="routes.booking"
        routerLinkActive="active"
        (click)="closeMenu()"
        >{{ lang.t().nav.bookNow }}</a
      >
      <app-language-switcher />
    </nav>
  </div>
</header>
